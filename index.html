<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
</head>
<body>
    <div>
        <h1 id="formTitle">Entrar</h1>
        <form method="POST" action="/tela" id="form">
            Nome da sala :<input type="text" required id="name">
            Senha da sala :<input type="password" required id="password">
            <button id="submitButton" type="submit">Entrar</button>
        </form>
    </div>
    <button id="changeType">Criar Sala</button>
</body>
<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();

    let form = document.querySelector('#form');
    let name = document.querySelector('#name');
    let password = document.querySelector('#password');
    let changeType = document.querySelector('#changeType');
    let type = "enter";

    changeType.addEventListener('click', (e) => {
        if(type == "enter"){
            type = "create";
            document.querySelector('#submitButton').innerHTML = "Criar";
            document.querySelector('#formTitle').innerHTML = "Criar sala";
            changeType.innerHTML = "Entrar"
        }else{
            type = "enter";
            document.querySelector('#submitButton').innerHTML = "Entrar";
            document.querySelector('#formTitle').innerHTML = "Entrar";
            changeType.innerHTML = "Criar sala" 
        }
    })

    form.addEventListener('submit', (e) => {
        socket.emit('roomInfo', name.value, password.value, type);
    })
</script>
</html>
